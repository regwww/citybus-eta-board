<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<title>城巴到站顯示板 · Citybus ETA Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=10" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1020'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='18' font-weight='900' fill='%23ffb020' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">B</span>
      <div class="brand-text">
        <span class="brand-title">城巴到站顯示板</span>
        <span class="brand-sub">Citybus · Real-time ETA</span>
      </div>
    </div>
    <nav class="modes">
      <button class="mode-btn active" data-mode="board">顯示板</button>
      <button class="mode-btn" data-mode="nearby">附近車站</button>
    </nav>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <!-- BOARD MODE -->
  <main class="view board-view active" id="boardView">
    <section class="route-header">
      <div class="route-badge" id="routeBadge">B3X</div>
      <div class="route-meta">
        <div class="dest" id="destName">深圳灣口岸</div>
        <div class="dest-en" id="destEn">Shenzhen Bay Port</div>
      </div>
      <button class="icon-btn settings-btn" id="settingsBtn" title="切換路線 / 車站" aria-label="設定">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </section>

    <div class="stop-bar">
      <span class="stop-label">本站</span>
      <span class="stop-name" id="stopName">紅橋</span>
      <span class="stop-sub" id="stopSub">Hung Kiu · 屯門公路</span>
    </div>

    <div class="eta-cards" id="etaCards"></div>

    <div class="board-footer">
      <span class="updated" id="updated">--</span>
      <button class="refresh-btn" id="refreshBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        手動刷新
      </button>
      <span class="auto-tag" id="autoTag">自動刷新 30s</span>
    </div>
  </main>

  <!-- NEARBY MODE -->
  <main class="view nearby-view" id="nearbyView">
    <div class="nearby-head">
      <h2>附近城巴站</h2>
      <button class="locate-btn" id="locateBtn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        重新定位
      </button>
    </div>
    <p class="hint" id="nearbyHint">點擊「重新定位」以使用 GPS 搜尋附近車站。</p>
    <div class="stop-list" id="stopList"></div>
  </main>

  <!-- STOP DETAIL (nearby selected) -->
  <main class="view stop-detail-view" id="stopDetailView">
    <button class="back-btn" id="backBtn">← 返回附近車站</button>
    <div class="detail-header">
      <div class="stop-name-lg" id="detailStopName">--</div>
      <div class="stop-name-en" id="detailStopSub">--</div>
    </div>
    <div class="eta-cards compact" id="detailEtaCards"></div>
    <div class="board-footer"><span class="updated" id="detailUpdated">--</span><span class="auto-tag" id="detailAutoTag">自動刷新 30s</span></div>
  </main>
</div>

<!-- SETTINGS PANEL -->
<aside class="settings-panel" id="settingsPanel" aria-hidden="true">
  <div class="settings-head">
    <h3>切換路線 / 車站</h3>
    <button class="close-btn" id="closeSettings">✕</button>
  </div>
  <label class="field">
    <span>路線號碼</span>
    <input id="routeInput" list="routeList" placeholder="例如 B3X" autocomplete="off" />
    <datalist id="routeList"></datalist>
  </label>
  <div class="dir-toggle" id="dirToggle">
    <button class="dir-btn active" data-dir="outbound">去程</button>
    <button class="dir-btn" data-dir="inbound">回程</button>
  </div>
  <label class="field">
    <span>車站</span>
    <select id="stopSelect"><option value="">選擇路線後載入車站</option></select>
  </label>
  <div class="settings-actions">
    <button class="primary-btn" id="applySettings">套用</button>
  </div>
</aside>
<div class="overlay" id="overlay" hidden></div>

<script src="app.js?v=10"></script>
</body>
</html>
